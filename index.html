<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Awenbot">
  <meta name="description" content="Awenbot – live mic + randomised slice playback">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <title>Awenbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Bungee&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card: #0a0a0a;
      --card-border: #222;
      --text: #ffffff;
      --muted: #666;
      --danger: #ff2a2a;
      --live: #14e814;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      line-height: 1.4;
      padding: 0 0 40px;
      padding-bottom: env(safe-area-inset-bottom, 40px);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 16px 16px;
      padding-top: max(18px, env(safe-area-inset-top));
      border-bottom: 1px solid #1a1a1a;
      gap: 16px;
    }

    .logo-wrap {
      flex-shrink: 0;
      width: min(160px, 42vw);
    }

    .logo-wrap img {
      width: 100%;
      height: auto;
      display: block;
      filter: contrast(1.08);
    }

    .bot-title {
      font-family: 'Black Ops One', 'Bungee', Impact, sans-serif;
      font-size: clamp(2.6rem, 12vw, 3.6rem);
      line-height: 1;
      letter-spacing: 0.04em;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #111;
      -webkit-text-stroke: 0.5px #fff;
      text-align: right;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 18px 16px 0;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 3px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-bottom: 14px;
      font-weight: 600;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .row:last-child { margin-bottom: 0; }

    button {
      appearance: none;
      border: 1px solid #333;
      border-radius: 2px;
      padding: 14px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.08s;
      flex: 1;
      min-height: 50px;
      background: #111;
      color: var(--text);
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-start {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .btn-stop {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger);
    }

    .btn-secondary {
      background: transparent;
      border-color: #333;
      color: var(--text);
    }

    .btn-secondary.active {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    label {
      display: block;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input[type="range"] {
      width: 100%;
      height: 28px;
      -webkit-appearance: none;
      background: transparent;
      margin: 0;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      background: #222;
      border-radius: 1px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      margin-top: -7.5px;
      border: none;
    }

    input[type="range"]::-moz-range-track {
      height: 3px;
      background: #222;
      border-radius: 1px;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: none;
    }

    .value {
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
      color: #fff;
      min-width: 52px;
      text-align: right;
      font-weight: 500;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
    }

    .dot.live {
      background: var(--live);
      box-shadow: 0 0 10px var(--live);
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .meter-wrap {
      height: 3px;
      background: #1a1a1a;
      border-radius: 1px;
      overflow: hidden;
      margin-top: 10px;
    }

    .meter {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.05s linear;
    }

    .hint {
      font-size: 0.72rem;
      color: #555;
      margin-top: 10px;
      line-height: 1.55;
    }

    .footer {
      text-align: center;
      font-size: 0.65rem;
      color: #333;
      margin-top: 28px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* Install banner */
    .install-banner {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111;
      border-top: 1px solid #333;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 100;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .install-banner.show { display: flex; }

    .install-banner button {
      flex: none;
      min-height: 40px;
      padding: 10px 16px;
      font-size: 0.8rem;
    }
  </style>
</head>

    <div class="bot-title">BOT</div>

  <div class="container">

    <div class="card">
      <div class="card-title">Microphone</div>
      <div class="row">
        <button id="btnStart" class="btn-start">Start Mic</button>
        <button id="btnStop" class="btn-stop" disabled>Stop</button>
      </div>
      <div class="status">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Idle</span>
      </div>
      <div class="meter-wrap">
        <div class="meter" id="levelMeter"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Slice Playback</div>

      <div class="row">
        <div style="flex:1">
          <label>Density</label>
          <input type="range" id="density" min="0.2" max="12" step="0.1" value="2.5">
        </div>
        <div class="value" id="densityVal">2.5 /s</div>
      </div>

      <div class="row">
        <div style="flex:1">
          <label>Slice Length</label>
          <input type="range" id="sliceLen" min="20" max="800" step="10" value="120">
        </div>
        <div class="value" id="sliceLenVal">120 ms</div>
      </div>

      <div class="row">
        <div style="flex:1">
          <label>Position Range</label>
          <input type="range" id="range" min="0.1" max="1" step="0.05" value="0.85">
        </div>
        <div class="value" id="rangeVal">85%</div>
      </div>

      <div class="row">
        <div style="flex:1">
          <label>Volume</label>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
        </div>
        <div class="value" id="volumeVal">70%</div>
      </div>

      <div class="row" style="margin-top: 8px;">
        <button id="btnMute" class="btn-secondary">Mute</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Buffer</div>
      <div class="row">
        <div style="flex:1">
          <label>Buffer Length</label>
          <input type="range" id="bufLen" min="1" max="8" step="0.5" value="3">
        </div>
        <div class="value" id="bufLenVal">3.0 s</div>
      </div>
      <p class="hint">
        Live mic writes into a circular buffer.<br>
        Random short slices are triggered from earlier positions in that buffer.
      </p>
    </div>

    <p class="footer">Awen · Experimental Audio</p>
  </div>

  <div class="install-banner" id="installBanner">
    <span style="font-size:0.85rem;color:#ccc;">Install Awenbot</span>
    <button class="btn-start" id="btnInstall" style="flex:none;">Install</button>
  </div>

  <script>
    // ─── PWA Service Worker ──────────────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // Install prompt
    let deferredPrompt = null;
    const installBanner = document.getElementById('installBanner');
    const btnInstall = document.getElementById('btnInstall');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBanner.classList.add('show');
    });

    btnInstall.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBanner.classList.remove('show');
    });

    // ─── Audio Engine ────────────────────────────────────────────────────────
    let audioCtx = null;
    let micStream = null;
    let micSource = null;
    let recorderNode = null;
    let analyser = null;
    let masterGain = null;
    let isRunning = false;
    let isMuted = false;

    let buffer = null;
    let bufferLength = 0;
    let writePos = 0;

    let sliceTimer = null;
    let density = 2.5;
    let sliceDuration = 0.12;
    let positionRange = 0.85;
    let volume = 0.7;

    const btnStart   = document.getElementById('btnStart');
    const btnStop    = document.getElementById('btnStop');
    const btnMute    = document.getElementById('btnMute');
    const statusDot  = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const levelMeter = document.getElementById('levelMeter');

    const densitySlider  = document.getElementById('density');
    const sliceLenSlider = document.getElementById('sliceLen');
    const rangeSlider    = document.getElementById('range');
    const volumeSlider   = document.getElementById('volume');
    const bufLenSlider   = document.getElementById('bufLen');

    const densityVal  = document.getElementById('densityVal');
    const sliceLenVal = document.getElementById('sliceLenVal');
    const rangeVal    = document.getElementById('rangeVal');
    const volumeVal   = document.getElementById('volumeVal');
    const bufLenVal   = document.getElementById('bufLenVal');

    function updateUI() {
      densityVal.textContent  = density.toFixed(1) + ' /s';
      sliceLenVal.textContent = Math.round(sliceDuration * 1000) + ' ms';
      rangeVal.textContent    = Math.round(positionRange * 100) + '%';
      volumeVal.textContent   = Math.round(volume * 100) + '%';
      bufLenVal.textContent   = parseFloat(bufLenSlider.value).toFixed(1) + ' s';
    }

    densitySlider.oninput = () => {
      density = parseFloat(densitySlider.value);
      updateUI();
      if (isRunning) restartSliceTimer();
    };
    sliceLenSlider.oninput = () => {
      sliceDuration = parseFloat(sliceLenSlider.value) / 1000;
      updateUI();
    };
    rangeSlider.oninput = () => {
      positionRange = parseFloat(rangeSlider.value);
      updateUI();
    };
    volumeSlider.oninput = () => {
      volume = parseFloat(volumeSlider.value);
      if (masterGain) masterGain.gain.value = isMuted ? 0 : volume;
      updateUI();
    };
    bufLenSlider.oninput = () => updateUI();

    function setStatus(live, text) {
      statusDot.classList.toggle('live', live);
      statusText.textContent = text;
    }

    function updateMeter() {
      if (!analyser || !isRunning) return;
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        sum += v * v;
      }
      const rms = Math.sqrt(sum / data.length);
      levelMeter.style.width = Math.min(100, rms * 280) + '%';
      requestAnimationFrame(updateMeter);
    }

    function createRecorder() {
      const bufferSize = 2048;
      const rec = audioCtx.createScriptProcessor(bufferSize, 1, 1);

      rec.onaudioprocess = (e) => {
        if (!isRunning || !buffer) return;
        const input = e.inputBuffer.getChannelData(0);
        for (let i = 0; i < input.length; i++) {
          buffer[writePos] = input[i];
          writePos = (writePos + 1) % bufferLength;
        }
      };

      const silent = audioCtx.createGain();
      silent.gain.value = 0;
      rec.connect(silent);
      silent.connect(audioCtx.destination);
      return rec;
    }

    function playSlice() {
      if (!isRunning || !buffer || bufferLength === 0) return;

      const usable = Math.floor(bufferLength * positionRange);
      if (usable < 64) return;

      const offset = Math.floor(Math.random() * usable);
      let startIdx = (writePos - usable + offset + bufferLength) % bufferLength;

      const sliceSamples = Math.min(
        Math.floor(sliceDuration * audioCtx.sampleRate),
        usable
      );

      const sliceBuf = audioCtx.createBuffer(1, sliceSamples, audioCtx.sampleRate);
      const data = sliceBuf.getChannelData(0);

      for (let i = 0; i < sliceSamples; i++) {
        data[i] = buffer[(startIdx + i) % bufferLength];
      }

      const fadeSamples = Math.min(64, Math.floor(sliceSamples / 4));
      for (let i = 0; i < fadeSamples; i++) {
        const g = i / fadeSamples;
        data[i] *= g;
        data[sliceSamples - 1 - i] *= g;
      }

      const src = audioCtx.createBufferSource();
      src.buffer = sliceBuf;
      src.connect(masterGain);
      src.start();
    }

    function restartSliceTimer() {
      if (sliceTimer) clearInterval(sliceTimer);
      if (density <= 0) return;
      sliceTimer = setInterval(playSlice, 1000 / density);
    }

    async function start() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        micSource = audioCtx.createMediaStreamSource(micStream);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        micSource.connect(analyser);

        masterGain = audioCtx.createGain();
        masterGain.gain.value = volume;
        masterGain.connect(audioCtx.destination);

        const seconds = parseFloat(bufLenSlider.value);
        bufferLength = Math.floor(seconds * audioCtx.sampleRate);
        buffer = new Float32Array(bufferLength);
        writePos = 0;

        recorderNode = createRecorder();
        micSource.connect(recorderNode);

        isRunning = true;
        btnStart.disabled = true;
        btnStop.disabled = false;
        setStatus(true, 'Listening + slicing');
        updateMeter();
        restartSliceTimer();

      } catch (err) {
        console.error(err);
        setStatus(false, 'Mic access denied');
        alert('Could not access microphone.\n\n' + err.message);
      }
    }

    function stop() {
      isRunning = false;
      if (sliceTimer) {
        clearInterval(sliceTimer);
        sliceTimer = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      if (recorderNode) {
        recorderNode.disconnect();
        recorderNode = null;
      }
      if (micSource) {
        micSource.disconnect();
        micSource = null;
      }
      if (audioCtx) {
        audioCtx.close();
        audioCtx = null;
      }
      buffer = null;
      btnStart.disabled = false;
      btnStop.disabled = true;
      levelMeter.style.width = '0%';
      setStatus(false, 'Stopped');
    }

    btnStart.addEventListener('click', start);
    btnStop.addEventListener('click', stop);

    btnMute.addEventListener('click', () => {
      isMuted = !isMuted;
      if (masterGain) masterGain.gain.value = isMuted ? 0 : volume;
      btnMute.textContent = isMuted ? 'Unmute' : 'Mute';
      btnMute.classList.toggle('active', isMuted);
    });

    updateUI();

    document.querySelectorAll('input[type=range]').forEach(el => {
      el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
    });
  </script>
</body>
</html>
